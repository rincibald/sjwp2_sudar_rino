<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Movie Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>🎬 My Movie Gallery</h1>

  <div class="filters">
    <button onclick="filterItems(event, 'all')" class="active">All</button>
    <button onclick="filterItems(event, 'movie')">Movies</button>
    <button onclick="filterItems(event, 'series')">Series</button>
    <button onclick="filterItems(event, 'documentary')">Documentaries</button>
  </div>

  <div id="gallery" class="gallery"></div>
  <div id="modal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal()">&times;</span>
      <img id="modal-img" />
      <h2 id="modal-title"></h2>
      <p id="modal-rating"></p>
      <p id="modal-cast"></p>
      <p id="modal-desc"></p>
    </div>
  </div>

  <script src="index.js"></script>
</body>
</html>
